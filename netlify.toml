# FluencyBridge — Netlify deployment
#
#   public/            -> static UI, served straight from the Netlify CDN
#   netlify/functions  -> one function wrapping the Express app (server.js)
#   /api/*             -> rewritten to that function with status 200 so the
#                         original URL survives and Express routing is unchanged
#
# Runtime secrets (AZURE_SPEECH_KEY, DEEPSEEK_API_KEY, ACCESS_CODE, …) belong in
# Site settings → Environment variables. .env is never deployed.

[build]
  # Regenerates public/scenarios.json (the complete 276-target bank served by
  # the CDN) from src/scenarios.js on every deploy, so the static copy can
  # never drift from the source of truth.
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # The Azure Speech SDK ships native binaries and loads assets at require
  # time; inlining it with esbuild can make the function fail to load, which
  # used to leave the UI on its 3-line offline stub. Ship it as a real
  # node_module instead.
  external_node_modules = ["microsoft-cognitiveservices-speech-sdk"]

# /api/assess -> /.netlify/functions/api/assess (200 = rewrite, not a redirect)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Static assets (index.html, js/*, styles.css) are served by `publish` above
# before any redirect is consulted, so they never touch the function.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
